[package]
name = "oggoat"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/findit-studio/oggoat"
homepage = "https://github.com/findit-studio/oggoat"
documentation = "https://docs.rs/oggoat"
description = "A pure-Rust Ogg container writer: streaming, constant memory, with the Opus, Vorbis, FLAC, Speex, Theora and VP8 mappings."
license = "MIT OR Apache-2.0"
rust-version = "1.95"
keywords = ["ogg", "opus", "vorbis", "flac", "container"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding", "parser-implementations", "no-std"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[dependencies]

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
